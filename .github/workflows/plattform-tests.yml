name: Plattform testen

on:
  push:
    paths: ['plattform/**', '.github/workflows/plattform-tests.yml']
  pull_request:
    paths: ['plattform/**']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plattform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plattform/package-lock.json
      - run: npm ci

      - name: API-Tests (Rechte, Provision, Storno, Uploads, Kalender …)
        run: npm test

      - name: Browser installieren
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Website starten
        run: |
          export DATA_DIR="$RUNNER_TEMP/e2e-data"
          ADMIN_PASSWORD='admin-passwort-123' npm run create-admin -- admin@mhl.test "Admin"
          DATA_DIR="$DATA_DIR" PORT=3000 nohup npm start > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/meta >/dev/null && break; sleep 1; done

      - name: Browser-Durchlauf am Handy (Anfrage → Angebot → Auftrag → Rechnung)
        run: |
          mkdir -p "$RUNNER_TEMP/screenshots"
          BASE=http://localhost:3000 SHOTS="$RUNNER_TEMP/screenshots" npm run e2e

      - name: Netlify-Demo bauen und testen (statisch, Daten im Browser)
        run: |
          npm run build:demo
          (cd demo-dist && nohup python3 -m http.server 3200 >/dev/null 2>&1 &)
          sleep 1
          BASE=http://localhost:3200 SHOTS="$RUNNER_TEMP/screenshots" node test/e2e/demo.js

      - name: Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore

      - name: Server-Log bei Fehler
        if: failure()
        run: cat "$RUNNER_TEMP/server.log" || true
